name: Verify a published CoreMDM OTA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, for example v0.9.50'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the published production build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          mkdir candidate
          gh release download "$RELEASE_TAG" --repo coremdm/releases --pattern app-release.apk --dir candidate
          gh release download "$RELEASE_TAG" --repo coremdm/releases --pattern ota-verification.json --dir candidate
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs candidate/app-release.apk > candidate/certificates.txt
          "$tools/aapt" dump badging candidate/app-release.apk > candidate/package.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('candidate')
          report = json.loads((root / 'ota-verification.json').read_text())
          cert = '432840faf7c8019bcbc4ee39dd9594f3568f5d0422f94242b27bee45804837ea'
          signers = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)', (root / 'certificates.txt').read_text())
          assert signers == report['certificates'] == [cert], 'Production signing certificate mismatch'
          metadata = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", (root / 'package.txt').read_text())
          assert metadata, 'Package metadata missing'
          package, code, name = metadata.groups()
          assert package == report['package'] == 'com.core.mdm', 'Package mismatch'
          assert int(code) == report['versionCode'] > report['previousVersionCode'], 'Version code does not increase'
          assert report['tag'] == os.environ['RELEASE_TAG'] == 'v' + name, 'Release tag mismatch'
          assert name == report['versionName'], 'Version name mismatch'
          assert report['sourceRepository'] == 'coremdm/coremdm', 'Incorrect signing source repository'
          assert report['distributionRepository'] == 'coremdm/releases', 'Incorrect distribution repository'
          assert re.fullmatch('[0-9a-f]{40}', report['sourceCommit']), 'Source commit missing'
          assert hashlib.sha256((root / 'app-release.apk').read_bytes()).hexdigest() == report['sha256'], 'APK integrity mismatch'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Verified {report['tag']} - {package} - version code {code}\nProduction signer: {cert}\n")
          PY
