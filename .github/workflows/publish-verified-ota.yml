name: Publish verified production APK

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-verified-ota.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-coremdm-ota-0.9.12
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve audited production build
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5330-81f5-8791-bc0487ef7d01/raw?se=2026-11-06T14%3A18%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=43c756fa-46c5-49af-981e-9b9a2258045d&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T03%3A13%3A05Z&ske=2026-11-07T03%3A13%3A05Z&sks=b&skv=2026-02-06&sig=YlOwmyAzoYtyD/suLIU3yoPFkoDumrBJv22uHN4Rq64%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output candidate.zip
          echo 'bed1c0debe08a00cabf639f16d9b796ec346f11c6f014129208c270bfd317686  candidate.zip' | sha256sum -c -
          mkdir candidate
          unzip -q candidate.zip -d candidate
      - name: Verify production signature, package and increasing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'b571409bfae386d327d4023740d32e585f7bf00922f7db769f16e067bae5c345  candidate/app-release.apk' | sha256sum -c -
          mkdir previous
          gh release download v0.9.11 --repo coremdm/releases --pattern app-release.apk --dir previous
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs previous/app-release.apk > previous-cert.txt
          "$tools/apksigner" verify --print-certs candidate/app-release.apk > candidate-cert.txt
          "$tools/aapt" dump badging previous/app-release.apk > previous-package.txt
          "$tools/aapt" dump badging candidate/app-release.apk > candidate-package.txt
          gh api repos/coremdm/releases/releases/latest --jq .tag_name > latest-tag.txt
          python3 - <<'PY'
          import pathlib, re, hashlib
          def signer(path):
              return re.search(r'certificate SHA-256 digest: ([0-9a-f]+)', pathlib.Path(path).read_text()).group(1)
          expected = '432840faf7c8019bcbc4ee39dd9594f3568f5d0422f94242b27bee45804837ea'
          assert signer('previous-cert.txt') == signer('candidate-cert.txt') == expected, 'Production certificate mismatch'
          def package(path):
              return re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", pathlib.Path(path).read_text()).groups()
          previous = package('previous-package.txt')
          current = package('candidate-package.txt')
          assert previous[0] == current[0] == 'com.core.mdm'
          assert current[1:] == ('79', '0.9.12')
          assert int(current[1]) > int(previous[1]), 'OTA version code must increase'
          latest = pathlib.Path('latest-tag.txt').read_text().strip()
          assert tuple(map(int, latest.removeprefix('v').split('.'))) <= (0,9,12), 'A newer release already exists'
          sha = hashlib.sha256(pathlib.Path('candidate/app-release.apk').read_bytes()).hexdigest()
          report = f'CoreMDM OTA 0.9.12\nPackage: {current[0]}\nVersion code: {previous[1]} -> {current[1]}\nProduction signer SHA-256: {expected}\nAPK SHA-256: {sha}\nSigned build source: coremdm/coremdm@692deb8e33dfa2b91b83955eb86fd67f35822ae3\nSigned build run: 42228705728\nProduction signing key is used only in coremdm/coremdm CI.\n'
          pathlib.Path('ota-verification.txt').write_text(report)
          print(report)
          PY
      - name: Publish OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' 'CoreMDM 0.9.12: redesigned Android interface with Home, Apps, Protection, Device and More navigation, clearer settings, larger descriptions and improved search.' '' 'Signed in coremdm/coremdm using the permanent production key. Package and certificate match v0.9.11; versionCode increases from 78 to 79. Existing settings and device management are retained.' > release-notes.txt
          if gh release view v0.9.12 --repo coremdm/releases >/dev/null 2>&1; then
            mkdir published
            gh release download v0.9.12 --repo coremdm/releases --pattern app-release.apk --dir published
            cmp candidate/app-release.apk published/app-release.apk
          else
            gh release create v0.9.12 candidate/app-release.apk ota-verification.txt --repo coremdm/releases --title 'CoreMDM v0.9.12' --notes-file release-notes.txt --latest
          fi
          cat ota-verification.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'OTA download: https://github.com/coremdm/releases/releases/download/v0.9.12/app-release.apk' >> "$GITHUB_STEP_SUMMARY"
