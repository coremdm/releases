name: Publish canonical production-signed OTA

on:
  push:
    branches: [main]
    paths: ['public-promotion-request.json', '.github/workflows/promote-public-candidate.yml', 'scripts/promote_candidate.py', 'scripts/verify_ota.py']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-production-coremdm-ota
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'coremdm/releases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test release safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Independently verify, publish and check the exact canonical candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/promote_candidate.py public-promotion-request.json scripts/verify_ota.py

      # Main CI signs and stages the exact reviewed archive. This token publishes only in this repository.
